# ==============================================================================
# Azure Landing Zone Infrastructure Pipeline
# Multi-Stage CI/CD with Quality, Security, and Approval Gates
# ==============================================================================

trigger:
  branches:
    include:
      - main
      - release/*
  paths:
    include:
      - infrastructure/**
      - azure-pipelines/azure-pipelines-infra.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infrastructure/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: azureServiceConnection
    value: 'sc-azure-landingzone-prod'
  - name: terraformVersion
    value: '1.5.7'
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/infrastructure'
  - name: tfStateResourceGroup
    value: 'rg-terraform-state-prod'
  - name: tfStateStorageAccount
    value: 'sttfstatemonolithprod'
  - name: tfStateContainer
    value: 'tfstate'
  - name: tfStateKey
    value: 'monolith-landingzone.terraform.tfstate'

stages:
  # ----------------------------------------------------------------------------
  # Stage 1: Validation, Formatting & Static Security Scanning
  # ----------------------------------------------------------------------------
  - stage: ValidateAndLint
    displayName: 'Validate & Lint'
    jobs:
      - job: QualityAndSecurityGates
        displayName: 'Terraform Format, Lint & Checkov Scan'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.10'
            displayName: 'Set Python 3.10'

          - script: |
              pip install checkov
              wget -O terraform.zip https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
              unzip terraform.zip && sudo mv terraform /usr/local/bin/
            displayName: 'Install Toolchain (Terraform & Checkov)'

          - script: |
              terraform fmt -check -recursive
            workingDirectory: $(workingDirectory)
            displayName: 'Check Terraform Formatting'

          - task: AzureCLI@2
            displayName: 'Terraform Init & Validate'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: $(workingDirectory)
              inlineScript: |
                terraform init -backend=false
                terraform validate

          - script: |
              checkov -d $(workingDirectory) --framework terraform --output junitxml --output-file-path $(System.DefaultWorkingDirectory)/checkov-report.xml || true
            displayName: 'Run Checkov IaC Security Scan'

          - task: PublishTestResults@2
            displayName: 'Publish Checkov Security Results'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(System.DefaultWorkingDirectory)/checkov-report.xml'
              testRunTitle: 'Checkov IaC Security Assessment'

  # ----------------------------------------------------------------------------
  # Stage 2: Speculative Terraform Plan
  # ----------------------------------------------------------------------------
  - stage: TerraformPlan
    displayName: 'Terraform Speculative Plan'
    dependsOn: ValidateAndLint
    condition: succeeded()
    jobs:
      - job: PlanJob
        displayName: 'Generate & Publish Execution Plan'
        steps:
          - task: AzureCLI@2
            displayName: 'Terraform Init with Azure Remote State'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: $(workingDirectory)
              inlineScript: |
                terraform init \
                  -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                  -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                  -backend-config="container_name=$(tfStateContainer)" \
                  -backend-config="key=$(tfStateKey)"

          - task: AzureCLI@2
            displayName: 'Generate Terraform Plan'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: $(workingDirectory)
              inlineScript: |
                terraform plan -var-file="../examples/terraform.tfvars.example" -out=$(Build.ArtifactStagingDirectory)/tfplan.binary
                terraform show -no-color $(Build.ArtifactStagingDirectory)/tfplan.binary > $(Build.ArtifactStagingDirectory)/tfplan.txt

          - publish: $(Build.ArtifactStagingDirectory)/tfplan.binary
            artifact: tfplan
            displayName: 'Publish Binary Terraform Plan'

          - publish: $(Build.ArtifactStagingDirectory)/tfplan.txt
            artifact: tfplan-summary
            displayName: 'Publish Human-Readable Plan'

  # ----------------------------------------------------------------------------
  # Stage 3: Production Deployment with Manual Approval Gate
  # ----------------------------------------------------------------------------
  - stage: TerraformApply
    displayName: 'Deploy Landing Zone to Production'
    dependsOn: TerraformPlan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyDeployment
        displayName: 'Gated Production Apply'
        environment: 'landing-zone-production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - download: current
                  artifact: tfplan
                  displayName: 'Download Approved Terraform Plan'

                - task: AzureCLI@2
                  displayName: 'Terraform Apply Approved Plan'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    workingDirectory: $(workingDirectory)
                    inlineScript: |
                      terraform init \
                        -backend-config="resource_group_name=$(tfStateResourceGroup)" \
                        -backend-config="storage_account_name=$(tfStateStorageAccount)" \
                        -backend-config="container_name=$(tfStateContainer)" \
                        -backend-config="key=$(tfStateKey)"
                      terraform apply -auto-approve $(Pipeline.Workspace)/tfplan/tfplan.binary
