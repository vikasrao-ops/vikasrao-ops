replicaCount: 5

image:
  repository: ghcr.io/vikasrao-ops/secure-api
  tag: "1.2.0"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: prod.vikasrao.cloud
      paths:
        - path: /
          pathType: Prefix

