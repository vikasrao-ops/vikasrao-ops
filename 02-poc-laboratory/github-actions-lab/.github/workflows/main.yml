name: "Matrix & Reusable Pipeline Demonstration"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  matrix-test:
    name: "Matrix Build"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test Environment Run
        run: |
          python -c "import sys; print(f'Execution OS: {sys.platform}, Python: {sys.version}')"

  call-reusable-staging:
    name: "Trigger Reusable Pipeline (Staging)"
    needs: matrix-test
    uses: ./.github/workflows/reusable-ci.yml
    with:
      target-environment: "staging"
      run-security-scan: true

