trigger:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'
  azureSubscription: 'sc-azure-platform-prod'

stages:
  # Stage 1: Build & Static Validation
  - stage: BuildAndValidate
    displayName: '1. Build & Security Scan'
    jobs:
      - job: BuildJob
        displayName: 'Compile, Test & Scan'
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'

          - script: |
              echo "==> Running Automated Unit Tests..."
              python -m unittest discover -s src -p "*test*.py"
            displayName: 'Execute Unit Tests'

          - script: |
              echo "==> Executing Checkov IaC Security Scan..."
              pip install checkov
              checkov -d infrastructure --framework terraform --soft-fail
            displayName: 'Checkov Security Gate'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.SourcesDirectory)'
              artifact: 'drop'

  # Stage 2: Staging Deployment
  - stage: DeployStaging
    displayName: '2. Deploy to Staging'
    dependsOn: BuildAndValidate
    condition: succeeded()
    jobs:
      - deployment: StagingDeployment
        environment: 'staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "==> Deploying artifact to Azure Staging Tier..."
                    chmod +x scripts/deploy.sh
                    ./scripts/deploy.sh staging
                  displayName: 'Deploy Workload (Staging)'

  # Stage 3: Gated Production Deployment
  - stage: DeployProduction
    displayName: '3. Deploy to Production (Gated)'
    dependsOn: DeployStaging
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ProductionDeployment
        environment: 'production' # Requires manual approval check in Azure DevOps environment settings
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "==> Deploying artifact to Azure Production Cluster..."
                    chmod +x scripts/deploy.sh
                    ./scripts/deploy.sh production
                  displayName: 'Deploy Workload (Production)'

