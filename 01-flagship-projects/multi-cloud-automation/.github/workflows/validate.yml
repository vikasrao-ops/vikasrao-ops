name: "Multi-Cloud Terraform Validation"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate-all:
    name: "Validate Multi-Cloud IaC"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud: [ "azure", "aws", "gcp" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Validate Cloud Configuration
        run: |
          cd infrastructure/${{ matrix.cloud }}
          terraform fmt -check
          terraform init -backend=false
          terraform validate

