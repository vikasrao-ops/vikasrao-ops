# ==============================================================================
# Monolithic Application Deployment Pipeline
# Packages Application Artifact and Deploys to Isolated VM with Key Vault Injection
# ==============================================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/monolith-app/**
      - azure-pipelines/azure-pipelines-app.yml

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: azureServiceConnection
    value: 'sc-azure-landingzone-prod'
  - name: resourceGroupName
    value: 'rg-monolith-spoke-prod'
  - name: vmName
    value: 'vm-monolith-app-prod'

stages:
  - stage: BuildAndPackage
    displayName: 'Build Monolith Package'
    jobs:
      - job: PackageApp
        displayName: 'Bundle Application Artifact'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
            displayName: 'Install Node.js 18.x'

          - script: |
              cd src/monolith-app
              npm install --production
              tar -czf $(Build.ArtifactStagingDirectory)/monolith-app.tar.gz server.js package.json systemd/ scripts/
            displayName: 'Package Production Bundle'

          - publish: $(Build.ArtifactStagingDirectory)/monolith-app.tar.gz
            artifact: drop
            displayName: 'Publish Monolith Artifact'

  - stage: DeployToMonolithVM
    displayName: 'Deploy to Private Linux VM'
    dependsOn: BuildAndPackage
    condition: succeeded()
    jobs:
      - deployment: DeployMonolith
        displayName: 'Deploy Artifact via Azure CLI Run-Command'
        environment: 'production-vm-workload'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - task: AzureCLI@2
                  displayName: 'Deploy Package and Restart Systemd Service'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      echo "Fetching VM power state..."
                      STATUS=$(az vm get-instance-view --resource-group $(resourceGroupName) --name $(vmName) --query "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus" -o tsv)
                      echo "VM Status is: $STATUS"

                      echo "Executing remote upgrade via Azure Run Command (No SSH exposed to internet)..."
                      az vm run-command invoke \
                        --resource-group $(resourceGroupName) \
                        --name $(vmName) \
                        --command-id RunShellScript \
                        --scripts "
                          echo 'Deploying monolithic updates...'
                          systemctl restart monolith.service
                          systemctl status monolith.service --no-pager
                        "
