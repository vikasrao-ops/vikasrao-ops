# Reusable Step Template: Secret Scanning with Gitleaks
steps:
  - script: |
      echo "Fetching Gitleaks security scanner..."
      curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz -C /tmp
      sudo mv /tmp/gitleaks /usr/local/bin/
      
      echo "Executing Gitleaks against codebase history..."
      gitleaks detect --source=$(Build.SourcesDirectory) --config=.gitleaks.toml --verbose --report-format json --report-path $(Build.ArtifactStagingDirectory)/gitleaks-report.json
    displayName: 'Scan Codebase for Secret Leaks'

  - publish: $(Build.ArtifactStagingDirectory)/gitleaks-report.json
    artifact: secret-scan-report
    displayName: 'Publish Secret Leak Report'
    condition: always()
