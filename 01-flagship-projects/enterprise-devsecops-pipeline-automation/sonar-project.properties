# SonarQube Project Configuration
sonar.projectKey=enterprise-devsecops-platform
sonar.projectName=Enterprise DevSecOps Automation Platform
sonar.projectVersion=1.0.0

# Source & Test Inclusion
sonar.sources=src/api-app
sonar.tests=src/api-app/test
sonar.inclusions=src/api-app/**/*.js
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js

# Test & Coverage Reporting
sonar.javascript.lcov.reportPaths=src/api-app/coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Strict Quality Gate Thresholds
sonar.qualitygate.wait=true
