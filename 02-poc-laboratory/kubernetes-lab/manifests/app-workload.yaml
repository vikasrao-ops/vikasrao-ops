apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-app-config
data:
  APP_LOG_LEVEL: "INFO"
  FEATURE_FLAG_METRICS: "enabled"
---
apiVersion: v1
kind: Secret
metadata:
  name: lab-app-secret
type: Opaque
stringData:
  DB_PASSWORD: "SuperSecureDemoPassword123!"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-resilient-app
  labels:
    app: resilient-workload
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: resilient-workload
  template:
    metadata:
      labels:
        app: resilient-workload
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: lab-app-config
          env:
            - name: DATABASE_SECRET
              valueFrom:
                secretKeyRef:
                  name: lab-app-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lab-resilient-svc
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: resilient-workload

